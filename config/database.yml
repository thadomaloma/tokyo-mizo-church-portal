# SQLite. The whole app (records, cache, jobs) lives in one database file, so
# a single server with one persistent folder is all production needs.
#
# Production keeps everything under storage/ — mount that folder as a volume
# and back it up (database file + uploaded receipts) together.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  # DATABASE_PATH lets you open a dry-run copy (see bin/railway-dry-run).
  database: <%= ENV.fetch("DATABASE_PATH") { "storage/development.sqlite3" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH") { "storage/production.sqlite3" } %>
